[workspace]
resolver = "2"
members = [
    # ECL crates
    "crates/ecl",
    "crates/design",
    "crates/ecl-core",
    "crates/ecl-steps",
    "crates/ecl-workflows",
    "crates/ecl-cli",
    "crates/ecl-pipeline-spec",
    "crates/ecl-pipeline-state",
    "crates/ecl-pipeline-topo",
    "crates/ecl-pipeline",
    "crates/ecl-adapter-fs",
    "crates/ecl-adapter-gdrive",
    "crates/ecl-adapter-slack",
    "crates/ecl-adapter-zapier",
    "crates/ecl-adapter-gcs",
    "crates/ecl-gcp-auth",
    "crates/ecl-secrets",
    "crates/ecl-adapter-sftp",
    "crates/ecl-stages",
    "crates/ecl-sink-kafka",
    "crates/ecl-sink-gcs",
    # Fabryk crates
    "crates/fabryk",
    "crates/fabryk-core",
    "crates/fabryk-content",
    "crates/fabryk-fts",
    "crates/fabryk-graph",
    "crates/fabryk-vector",
    "crates/fabryk-acl",
    "crates/fabryk-mcp",
    "crates/fabryk-mcp-core",
    "crates/fabryk-mcp-content",
    "crates/fabryk-mcp-fts",
    "crates/fabryk-mcp-graph",
    "crates/fabryk-mcp-semantic",
    "crates/fabryk-cli",
    "crates/fabryk-redis",
    # Fabryk auth crates
    "crates/fabryk-auth",
    "crates/fabryk-auth-google",
    "crates/fabryk-mcp-auth",
    # GCP utilities
    "crates/fabryk-gcp",
    # Workspace utilities
    "crates/textrynum-util",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
authors = ["Duncan McGreggor <oubiwann@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/oxur/textrynum"
homepage = "https://github.com/oxur/textrynum"
description = "Textrynum — Knowledge Fabric Workshop (Fabryk + ECL)"

[workspace.dependencies]
# ============================================================
# ECL Dependencies
# ============================================================

# Design documentation management
oxur-odm = "0.3.5"

# Resilience
backon = "1.6.0"
failsafe = "1.3.0"

# HTTP
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
tower = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
uuid = { version = "1.29.3", features = ["v4", "serde"] }
anyhow = "1.0.104"

# Testing
proptest = "1.12.0"

# ============================================================
# Shared Dependencies (ECL & Fabryk)
# ============================================================

# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
futures = "0.3.34"
async-trait = "0.1.92"

# Configuration and logging
confyg = "0.3.0"
twyg = "0.6.3"
log = "0.4.35"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

# CSV parsing
csv = "1.4.0"

# Archive / compression
zip = "9.8.1"
flate2 = "1.1.11"

# Kafka
rdkafka = { version = "0.40.0", features = ["cmake-build"] }

# Avro
apache-avro = "0.23.0"

# Error handling
thiserror = "2.0.21"

# Time
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"

# CLI
clap = { version = "4.6.9", features = ["derive", "env"] }

# Testing
tempfile = "3.27.0"

# ============================================================
# Fabryk-Specific Dependencies
# ============================================================

# MCP SDK
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }

# Schema support
schemars = "1.2.3"

# Markdown and frontmatter
pulldown-cmark = { version = "0.13.6", default-features = false }
yaml_serde = "0.10.7"

# File operations
glob = "0.3.4"
shellexpand = "3.1.2"
dirs = "7.0.0"
async-walkdir = "2.2.0"

# Regular expressions
regex = "1.13.2"

# Full-text search
tantivy = "0.27.0"

# String matching (for source resolution)
strsim = "0.11.1"

# Vector database
lancedb = "0.41.0"
arrow-array = "58.4.2"
arrow-schema = "58.4.2"

# Local embedding generation
fastembed = "7.7.1"

# JWT/Auth
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# Redis
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager"] }

# Graph database
petgraph = "0.8.3"
rkyv = { version = "0.8.18", features = ["bytecheck"] }
memmap2 = "0.9.12"
blake3 = "1.8.7"

# Pipeline state storage
redb = "5.0.0"

# Binary serialization
serde_bytes = "0.11.19"

# Base64 encoding (webhook auth)
base64 = "0.23.1"

# Async stream wrappers
tokio-stream = "0.1.19"

# PGP
pgp = "0.21.1"

# SSH/SFTP
russh = "0.65.4"
russh-sftp = "4.0.0"
russh-keys = "0.49.2"

# Dev dependencies
tokio-test = "0.4.6"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
